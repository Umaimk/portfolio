<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --panel:#141a30; --text:#e8ecf8; --muted:#9aa4c4;
    --accent:#6ea8ff; --accent2:#9b7bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}

  /* HERO */
  .hero{min-height:100vh;display:flex;align-items:center;padding:60px 0;
    background:radial-gradient(900px 500px at 80% 10%,rgba(155,123,255,.18),transparent),
               radial-gradient(700px 400px at 10% 90%,rgba(110,168,255,.15),transparent)}
  .hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15}
  .hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin:16px 0 24px;max-width:46ch}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:10px;border:1px solid #2a3358;color:var(--text);font-weight:600;font-size:.95rem}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;color:#0b1020}
  .hint{font-size:.8rem;color:var(--muted);margin-top:14px}

  /* FLIP CARD */
  .card-scene{perspective:1200px;display:flex;justify-content:center}
  .card{width:300px;height:460px;position:relative;transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    padding:24px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(160deg,#1b2347,#10152b);border:1px solid #2c3764;
    box-shadow:0 25px 60px rgba(0,0,0,.5)}
  .face::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;border-radius:20px 20px 0 0;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .back{transform:rotateY(180deg);justify-content:center;text-align:center}
  .lanyard{width:60px;height:8px;border-radius:6px;background:#0b1020;border:1px solid #2c3764;margin:8px 0 18px}
  .photo{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);
    background:#0b1020;display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--accent);overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover}
  .card h2{margin-top:16px;font-size:1.4rem}
  .role{color:var(--accent);font-weight:600;font-size:.95rem}
  .meta{margin-top:18px;width:100%;font-size:.85rem;color:var(--muted)}
  .meta div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #2a3358}
  .meta b{color:var(--text);font-weight:600}
  .tap{margin-top:auto;font-size:.75rem;color:var(--muted)}
  #qr{background:#fff;padding:14px;border-radius:14px;margin:18px 0 12px;display:inline-block}
  #qr img,#qr canvas{display:block}

  /* SECTIONS */
  section{padding:70px 0}
  h3.title{font-size:1.6rem;margin-bottom:24px}
  h3.title::after{content:"";display:block;width:50px;height:3px;border-radius:3px;margin-top:8px;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--panel);border:1px solid #232c52;padding:6px 14px;border-radius:999px;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .proj{background:var(--panel);border:1px solid #232c52;border-radius:14px;padding:20px;transition:transform .2s,border-color .2s}
  .proj:hover{transform:translateY(-4px);border-color:var(--accent)}
  .proj h4{margin-bottom:6px}
  .proj p{color:var(--muted);font-size:.9rem;margin-bottom:12px}
  .proj .tags{font-size:.78rem;color:var(--accent2);margin-bottom:10px}
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .link{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid #232c52;
    border-radius:12px;padding:14px 16px;color:var(--text);transition:border-color .2s}
  .link:hover{border-color:var(--accent)}
  .link .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020}
  .link small{display:block;color:var(--muted)}
  footer{text-align:center;padding:30px 0;color:var(--muted);font-size:.85rem;border-top:1px solid #1c2445}

  @media(max-width:800px){.hero .wrap{grid-template-columns:1fr;text-align:center}.hero p{margin-left:auto;margin-right:auto}.btns{justify-content:center}}
  @media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <h1>Hi, I'm <span id="heroName">Your Name</span></h1>
      <p id="heroBio"></p>
      <div class="btns">
        <a class="btn primary" href="#projects">See my work</a>
        <a class="btn" href="#connect">Connect with me</a>
      </div>
      <p class="hint">Tap the ID card to flip it, then scan the QR code with your phone.</p>
    </div>

    <div class="card-scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flip ID card">
        <div class="face front">
          <div class="lanyard"></div>
          <div class="photo" id="photo"></div>
          <h2 id="cardName"></h2>
          <div class="role" id="cardRole"></div>
          <div class="meta" id="cardMeta"></div>
          <div class="tap">Tap to flip ↻</div>
        </div>
        <div class="face back">
          <h2>Scan to view my portfolio</h2>
          <div id="qr"></div>
          <div class="tap" id="qrUrl"></div>
          <div class="tap" style="margin-top:14px">Tap to flip back ↻</div>
        </div>
      </div>
    </div>
  </div>
</header>

<section id="about"><div class="wrap">
  <h3 class="title">About</h3>
  <p id="about-text" style="color:var(--muted);max-width:70ch"></p>
</div></section>

<section id="skills"><div class="wrap">
  <h3 class="title">Skills</h3>
  <div class="chips" id="skills-list"></div>
</div></section>

<section id="projects"><div class="wrap">
  <h3 class="title">Projects</h3>
  <div class="grid" id="projects-list"></div>
</div></section>

<section id="connect"><div class="wrap">
  <h3 class="title">Connect</h3>
  <div class="links" id="links-list"></div>
</div></section>

<footer>© <span id="year"></span> <span id="footName"></span></footer>

<script>
/* ============ EDIT THIS PART ONLY ============ */
const PROFILE = {
  name: "Your Name",
  role: "Computer Science Student",
  idNumber: "ID-0001",
  location: "Karachi, Pakistan",
  photo: "",                       // e.g. "me.jpg" (put the image next to index.html). Leave "" for initials.
  siteUrl: "https://umaimk.github.io/portfolio/",                     // your deployed portfolio URL, e.g. "https://umaimk.github.io/portfolio/". "" = use current page URL.
  bio: "Third-year CS undergraduate who enjoys building software, exploring AI, and solving real-world problems with technology.",
  about: "I'm a third-year Computer Science student with hands-on experience from an internship at FlyRank. I work with Python, JavaScript, C++ and React Native, and I like turning ideas into working products.",
  skills: ["Python","JavaScript","C++","React","React Native","Next.js","Node.js","Express","MongoDB","Git & GitHub"],
  projects: [
    {title:"Cyber Tracker", desc:"GPS location tracker web app deployed on GitHub Pages.", tags:"JavaScript · Web", url:"https://umaimk.github.io/locationtracker"},
    {title:"Team Task Manager", desc:"MERN-stack app for managing tasks across a team.", tags:"MongoDB · Express · React · Node", url:"https://github.com/Umaimk/team-task-manager"},
    {title:"Personal Finance Tracker", desc:"Next.js finance tracker built during my FlyRank internship.", tags:"Next.js · Tailwind", url:"https://github.com/Umaimk"}
  ],
  links: [
    {label:"GitHub",    handle:"github.com/Umaimk", url:"https://github.com/Umaimk", ic:"GH"},
    {label:"LinkedIn",  handle:"your-linkedin",     url:"https://www.linkedin.com/in/your-linkedin", ic:"in"},
    {label:"Instagram", handle:"@your_instagram",   url:"https://www.instagram.com/your_instagram",  ic:"IG"},
    {label:"Email",     handle:"you@example.com",   url:"mailto:you@example.com", ic:"@"}
  ]
};
/* ============================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.title = PROFILE.name + " — Portfolio";
$("heroName").textContent = PROFILE.name;
$("heroBio").textContent = PROFILE.bio;
$("cardName").textContent = PROFILE.name;
$("cardRole").textContent = PROFILE.role;
$("about-text").textContent = PROFILE.about;
$("footName").textContent = PROFILE.name;
$("year").textContent = new Date().getFullYear();

$("cardMeta").innerHTML =
  `<div><span>ID</span><b>${esc(PROFILE.idNumber)}</b></div>` +
  `<div><span>Location</span><b>${esc(PROFILE.location)}</b></div>` +
  `<div><span>Status</span><b>Open to opportunities</b></div>`;

if (PROFILE.photo) {
  const img = document.createElement("img");
  img.src = PROFILE.photo; img.alt = PROFILE.name;
  $("photo").appendChild(img);
} else {
  $("photo").textContent = PROFILE.name.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
}

$("skills-list").innerHTML = PROFILE.skills.map(s => `<span class="chip">${esc(s)}</span>`).join("");

$("projects-list").innerHTML = PROFILE.projects.map(p =>
  `<div class="proj"><h4>${esc(p.title)}</h4><div class="tags">${esc(p.tags)}</div>
   <p>${esc(p.desc)}</p><a href="${esc(p.url)}" target="_blank" rel="noopener">View project →</a></div>`).join("");

$("links-list").innerHTML = PROFILE.links.map(l =>
  `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">
     <span class="ic">${esc(l.ic)}</span><span><b>${esc(l.label)}</b><small>${esc(l.handle)}</small></span></a>`).join("");

/* QR code */
const target = PROFILE.siteUrl || location.href.split("#")[0];
$("qrUrl").textContent = target;
try {
  new QRCode($("qr"), {text: target, width: 180, height: 180, colorDark:"#000000", colorLight:"#ffffff", correctLevel: QRCode.CorrectLevel.M});
} catch (e) {
  $("qr").textContent = "QR library failed to load (check your internet connection).";
}

/* Flip */
const card = $("card");
const flip = () => card.classList.toggle("flipped");
card.addEventListener("click", flip);
card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
</script>
</body>
</html>
